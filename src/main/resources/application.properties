spring.application.name=usermanager
spring.main.banner-mode=off

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/user_manager

# Database username
spring.datasource.username=postgres

# Database password
spring.datasource.password=1234

# JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIBERNATE / JPA CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Auto create/update tables based on entity classes
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (optional, good for dev)
spring.jpa.show-sql=true

# Format the SQL logs for readability
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (optional, Spring Boot uses HikariCP by default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------
# LOGGING
# ---------------------------

# Show SQL parameters
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Enable ANSI colors for console logs
spring.output.ansi.enabled=always